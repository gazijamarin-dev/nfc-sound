<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sound Trigger</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #111;
      color: white;
      font-family: sans-serif;
      user-select: none;
    }
  </style>
</head>
<body>
  <h2>Dodirni bilo gdje na ekranu</h2>

  <script>
    let audioCtx;

    function pokreniZvuk() {
      // Inicijalizacija AudioContexta nakon dodira
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }

      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      // Izvor zvuka (sintetizator) i pojačalo
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      // 'square' val stvara agresivan, vrlo glasan i oštar ton
      osc.type = 'square'; 
      osc.frequency.setValueAtTime(880, audioCtx.currentTime); // 880 Hz (visoki ton)

      // Postavljanje jacine zvuka na maksimalnu dopuštenu razinu
      gain.gain.setValueAtTime(1.0, audioCtx.currentTime);

      // Povezivanje komponente na zvučnike
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      // Pokretanje tona i gašenje nakon 0.6 sekundi
      osc.start();
      osc.stop(audioCtx.currentTime + 0.6);
    }

    // Okidač na prvi dodir ekrana
    document.addEventListener('pointerdown', pokreniZvuk, { once: true });
  </script>
</body>
</html>
