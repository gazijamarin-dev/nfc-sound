<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sound Trigger</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #111;
      color: white;
      font-family: sans-serif;
      user-select: none;
    }
  </style>
</head>
<body>
  <h2>Dodirni bilo gdje na ekranu</h2>

  <audio id="mojZvuk" src="german-music-ultra.mp3" preload="auto"></audio>

  <script>
    function pokreniZvuk() {
      const audio = document.getElementById('mojZvuk');
      audio.volume = 1.0;
      audio.play().catch(err => console.log(err));
    }

    document.addEventListener('pointerdown', pokreniZvuk, { once: true });
  </script>
</body>
</html>
